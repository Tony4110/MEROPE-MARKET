name: merope-capture

on:
  schedule:
    - cron: '17 6 * * *'   # tous les jours ~06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: merope-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        working-directory: capture
        run: npm install --no-audit --no-fund

      - name: Run capture
        id: run
        working-directory: capture
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: node capture.js

      - name: Report failure (commit comment)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="❌ merope-capture a échoué le $(date -u +%F) — voir le run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "commit comment non posté"
