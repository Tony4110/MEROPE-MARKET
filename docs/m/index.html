<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Index de marché — Merope</title>
<meta name="description" content="Index d'intelligence verticalisé — un marché, capturé en continu, structuré et historisé. Un réseau Merope.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F7F4; --surface:#FFFFFF; --surface-2:#FAFBFA; --fg:#14201C; --muted:#5A6A62;
    --line:#E3E9E4; --accent:#0E7C5A; --accent-weak:#E4F1EA; --star:#A8781A;
    --t-data:#2E6FA6; --t-hist:#0E7C5A; --t-event:#8A54AE; --t-signal:#B07714; --t-pack:#14201C;
    --font-display:'Fraunces',Georgia,'Times New Roman',serif;
    --font-body:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0E1512; --surface:#152019; --surface-2:#111A16; --fg:#EAF2EE; --muted:#9DB0A7;
    --line:#243029; --accent:#34D399; --accent-weak:#163029; --star:#E3C25A;
    --t-data:#5AA9E6; --t-hist:#34D399; --t-event:#B98AD6; --t-signal:#E3C25A; --t-pack:#9DB0A7; color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#0E1512; --surface:#152019; --surface-2:#111A16; --fg:#EAF2EE; --muted:#9DB0A7;
    --line:#243029; --accent:#34D399; --accent-weak:#163029; --star:#E3C25A;
    --t-data:#5AA9E6; --t-hist:#34D399; --t-event:#B98AD6; --t-signal:#E3C25A; --t-pack:#9DB0A7; color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1000px;margin:0 auto;padding-inline:20px}
  /* slim top */
  header{border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);position:sticky;top:0;z-index:10}
  .hd{display:flex;align-items:center;gap:10px;padding:11px 0;flex-wrap:wrap}
  .mark{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:600;font-size:18px}
  .mark .star{width:14px;height:14px;flex:none}
  .by{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--muted)}
  .by a{color:var(--accent);text-decoration:none}
  .tgl{background:none;border:1px solid var(--line);border-radius:999px;width:28px;height:28px;cursor:pointer;color:var(--muted);flex:none}
  /* hero */
  .hero{padding-block:48px 10px}
  .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:7px}
  .eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
  .hero h1{font-family:var(--font-display);font-weight:600;font-size:clamp(32px,6vw,56px);line-height:1.04;margin:14px 0 12px;text-wrap:balance}
  .hero p{font-size:17px;color:var(--muted);max-width:60ch;margin:0}
  /* stats */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:30px}
  @media(max-width:620px){.stats{grid-template-columns:1fr 1fr}}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
  .stat .v{font-family:var(--font-display);font-weight:600;font-size:30px;font-variant-numeric:tabular-nums}
  .stat .k{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-top:3px}
  .lab{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:44px 0 14px}
  /* products */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
  .tag{display:inline-block;font-family:var(--font-mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;padding:3px 8px;border-radius:6px;color:#fff;align-self:flex-start}
  .t-data{background:var(--t-data)} .t-hist{background:var(--t-hist)} .t-event{background:var(--t-event)} .t-signal{background:var(--t-signal)} .t-pack{background:var(--t-pack);color:var(--bg)}
  .card h3{font-family:var(--font-display);font-weight:600;font-size:18px;margin:2px 0 0;line-height:1.15}
  .mrow{font-family:var(--font-mono);font-size:11px;color:var(--muted);line-height:1.7}
  .mrow b{color:var(--fg);font-weight:600}
  .prev{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}
  .prev div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:4px}
  .price{font-family:var(--font-display);font-weight:600;font-size:22px}
  .price small{font-family:var(--font-mono);font-size:10px;color:var(--muted);font-weight:400;display:block}
  .buy{appearance:none;border:none;border-radius:9px;background:var(--accent);color:#fff;font:inherit;font-weight:600;font-size:13px;padding:9px 13px;cursor:pointer}
  /* what it tracks */
  .tracks{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:720px){.tracks{grid-template-columns:1fr}}
  .tk{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
  .tk .n{font-family:var(--font-mono);font-size:10px;color:var(--accent)}
  .tk h4{font-family:var(--font-display);font-weight:600;font-size:15px;margin:6px 0 4px}
  .tk p{font-size:12.5px;color:var(--muted);margin:0;line-height:1.5}
  /* operator */
  .opcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .opcard .av{width:48px;height:48px;border-radius:12px;background:var(--star);color:#fff;font-family:var(--font-display);font-weight:600;font-size:20px;display:flex;align-items:center;justify-content:center;flex:none}
  .opcard h4{font-family:var(--font-display);font-size:18px;margin:0;font-weight:600}
  .opcard p{font-size:13px;color:var(--muted);margin:3px 0 0}
  .opcard .pill{margin-left:auto;font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:4px 10px}
  .state{padding:40px 0;text-align:center;font-family:var(--font-mono);font-size:13px;color:var(--muted)}
  .state.err{color:#c0392b}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .state.err{color:#ff8a80}}
  :root[data-theme="dark"] .state.err{color:#ff8a80}
  footer{border-top:1px solid var(--line);margin-top:54px;padding:26px 0 44px;font-family:var(--font-mono);font-size:11px;color:var(--muted);line-height:1.7}
  footer a{color:var(--accent)}
</style>
</head>
<body>
<header><div class="wrap hd">
  <span class="mark"><svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5l2.2 7.1 7.3.1-5.9 4.4 2.2 7-5.8-4.3L6.2 20l2.2-7L2.5 8.7l7.3-.1L12 1.5z" fill="var(--star)"/></svg><span id="markname">Index de marché</span></span>
  <span class="by" id="by"></span>
  <button class="tgl" id="tgl" title="Thème">◐</button>
</div></header>

<main class="wrap" id="app">
  <div class="state">Chargement de l'index…</div>
</main>

<footer><div class="wrap" id="foot">
  Un index d'intelligence verticalisé — réseau <a href="../">Merope</a>. Les signaux historiques s'enrichissent chaque jour. Prototype · données servies en direct.
</div></footer>

<script>
const SB_URL='https://rjcuuejbpkmtcxgiqyfo.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqY3V1ZWpicGttdGN4Z2lxeWZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMTAzMzEsImV4cCI6MjEwNjY4NjMzMX0.HEeR9Ee23d2PWMsHjlOc914XGIYvk9s8t4pLXWTZ7_A';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const initials=n=>String(n||'?').replace(/[^A-Za-zÀ-ÿ ]/g,'').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
const eur=v=>v==null?'—':'€'+Number(v).toLocaleString('fr-FR');
const TAGC={dataset:'t-data',history:'t-hist',events:'t-event',signals:'t-signal',market_pack:'t-pack'};
const TAGL={dataset:'Dataset',history:'Historique',events:'Évènements',signals:'Signaux',market_pack:'Market Pack'};

/* theme */
const tgl=document.getElementById('tgl');
try{const s=localStorage.getItem('merope-theme'); if(s)document.documentElement.setAttribute('data-theme',s);}catch(e){}
tgl.onclick=()=>{const cur=document.documentElement.getAttribute('data-theme');const sysDark=matchMedia('(prefers-color-scheme:dark)').matches;const n=cur?(cur==='dark'?'light':'dark'):(sysDark?'light':'dark');document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('merope-theme',n);}catch(e){}};

async function sb(path){
  const r=await fetch(`${SB_URL}/rest/v1/${path}`,{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});
  if(!r.ok) throw new Error(r.status+' '+(await r.text()).slice(0,120));
  return r.json();
}
function previewHtml(p){
  if(!p||typeof p!=='object')return '';
  if(Array.isArray(p.rows)&&p.rows.length) return '<div class="prev">'+p.rows.slice(0,3).map(r=>`<div>${esc(Array.isArray(r)?r.join(' · '):r)}</div>`).join('')+'</div>';
  if(Array.isArray(p.combines)&&p.combines.length) return `<div class="prev"><div>combine : ${esc(p.combines.join(' + '))}</div></div>`;
  return '';
}
const param=new URLSearchParams(location.search);
const OP=(param.get('op')||'energy-germany').toLowerCase();

async function load(){
  const app=document.getElementById('app');
  try{
    const ops=await sb(`operators?slug=eq.${encodeURIComponent(OP)}&select=id,name,bio,status,reputation,revenue_share,markets(name,tagline,slug),territories(name,slug)`);
    if(!ops.length){app.innerHTML=`<div class="state err">Marché « ${esc(OP)} » introuvable. Essayez ?op=energy-germany, founder-space, founder-capital…</div>`;return;}
    const o=ops[0];
    const mk=o.markets?o.markets.name:'Marché', mkt=o.markets?o.markets.tagline:'';
    const terr=o.territories?o.territories.name:'';
    const prods=await sb(`products?operator_id=eq.${o.id}&status=eq.live&select=name,product_type,price_eur,coverage,record_count,history_from,history_to,update_frequency,confidence,preview&order=price_eur.asc`);

    const title=`${mk} Index${terr?' — '+terr:''}`;
    document.title=`${title} · Merope`;
    document.getElementById('markname').textContent=title;
    document.getElementById('by').innerHTML=`opéré par ${esc(o.name)} · <a href="../">réseau Merope</a>`;

    const totalRecords=prods.reduce((s,p)=>s+(Number(p.record_count)||0),0);
    const confs=prods.map(p=>p.confidence).filter(Boolean);
    const topConf=confs.includes('High')?'High':(confs.includes('Medium')?'Medium':(confs[0]||'—'));

    app.innerHTML=`
      <section class="hero">
        <div class="eyebrow">Index en opération${terr?' · '+esc(terr):''}</div>
        <h1>${esc(title)}</h1>
        <p>${esc(mkt||'Intelligence de marché verticalisée — capturée en continu, structurée, historisée. La source de référence de ce marché.')}</p>
        <div class="stats">
          <div class="stat"><div class="v">${prods.length}</div><div class="k">Produits en vente</div></div>
          <div class="stat"><div class="v">${totalRecords?totalRecords.toLocaleString('fr-FR'):'—'}</div><div class="k">Enregistrements suivis</div></div>
          <div class="stat"><div class="v">${esc(topConf)}</div><div class="k">Confiance</div></div>
          <div class="stat"><div class="v">70%</div><div class="k">Part opérateur</div></div>
        </div>
      </section>

      <div class="lab">Données disponibles</div>
      <div class="grid" id="prods"></div>

      <div class="lab">Ce que suit cet index</div>
      <section class="tracks">
        <div class="tk"><div class="n">EN CONTINU</div><h4>État du marché</h4><p>Les acteurs, projets et actifs de ${esc(mk)}${terr?' en '+esc(terr):''}, nettoyés et structurés.</p></div>
        <div class="tk"><div class="n">HISTORISÉ</div><h4>Évolution dans le temps</h4><p>Chaque capture est datée et conservée — l'historique qui ne se rachète pas.</p></div>
        <div class="tk"><div class="n">SIGNAUX</div><h4>Changements détectés</h4><p>Nouveaux entrants, expansions, financements — à mesure que l'historique s'enrichit.</p></div>
      </section>

      <div class="lab">Opéré par</div>
      <div class="opcard">
        <div class="av">${esc(initials(o.name))}</div>
        <div><h4>${esc(o.name)}</h4><p>${esc(o.bio||'')}</p></div>
        <span class="pill">${o.status==='founding'?'Licence à attribuer':'Opérateur actif'}</span>
      </div>
    `;

    const pe=document.getElementById('prods');
    if(!prods.length){pe.innerHTML='<div class="state">Premiers produits en préparation.</div>';}
    else{
      pe.innerHTML=prods.map(p=>{
        const cls=TAGC[p.product_type]||'t-data', lab=TAGL[p.product_type]||p.product_type;
        const hist=(p.history_from&&p.history_to)?`${String(p.history_from).slice(0,4)}→${String(p.history_to).slice(0,4)}`:'—';
        const recs=p.record_count!=null?Number(p.record_count).toLocaleString('fr-FR'):'—';
        return `<article class="card">
          <span class="tag ${cls}">${esc(lab)}</span>
          <h3>${esc(p.name)}</h3>
          <div class="mrow">couverture <b>${esc(p.coverage||'—')}</b> · ${recs} enreg.<br>historique <b>${hist}</b> · maj ${esc(p.update_frequency||'—')} · confiance <b>${esc(p.confidence||'—')}</b></div>
          ${previewHtml(p.preview)}
          <div class="foot"><div class="price">${eur(p.price_eur)}<small>accès dataset</small></div><button class="buy">Acquérir</button></div>
        </article>`;
      }).join('');
      pe.querySelectorAll('.buy').forEach(b=>b.onclick=()=>alert('Prototype — le paiement n\'est pas encore actif.'));
    }
  }catch(e){app.innerHTML=`<div class="state err">Index indisponible — ${esc(e.message)}</div>`;}
}
load();
</script>
</body>
</html>
