<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Merope — Espace opérateur</title>
<meta name="description" content="Espace opérateur Merope : connectez-vous, découvrez votre futur marché et démarrez votre onboarding.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F7F4; --surface:#FFFFFF; --surface-2:#FAFBFA; --fg:#14201C; --muted:#5A6A62;
    --line:#E3E9E4; --accent:#0E7C5A; --accent-weak:#E4F1EA; --star:#A8781A;
    --font-display:'Fraunces',Georgia,serif;
    --font-body:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0E1512; --surface:#152019; --surface-2:#111A16; --fg:#EAF2EE; --muted:#9DB0A7;
    --line:#243029; --accent:#34D399; --accent-weak:#163029; --star:#E3C25A;
  }}
  :root[data-theme="dark"]{
    --bg:#0E1512; --surface:#152019; --surface-2:#111A16; --fg:#EAF2EE; --muted:#9DB0A7;
    --line:#243029; --accent:#34D399; --accent-weak:#163029; --star:#E3C25A;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:0 20px}
  header{position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(8px)}
  .hd{display:flex;align-items:center;gap:10px;padding:13px 0}
  .brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--fg)}
  .brand .star{width:14px;height:14px;flex:none}
  .brand b{font-family:var(--font-display);font-weight:600;font-size:20px}
  .brand span{font-family:var(--font-mono);font-size:10px;color:var(--muted)}
  .hd .right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .nav{display:flex;gap:15px;flex-wrap:wrap;font-size:13.5px;margin-left:4px}
  .nav a{color:var(--fg);text-decoration:none}
  .nav a[aria-current]{color:var(--accent);font-weight:600}
  .nav a:hover{color:var(--accent)}
  .umail{font-family:var(--font-mono);font-size:11px;color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lnk{background:none;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font:inherit;font-size:12px;color:var(--fg);cursor:pointer}
  .tgl{background:none;border:1px solid var(--line);border-radius:999px;width:30px;height:30px;cursor:pointer;color:var(--muted);flex:none}
  main{padding:34px 0 60px}
  .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
  h1{font-family:var(--font-display);font-weight:600;font-size:clamp(26px,5vw,38px);line-height:1.08;margin:0 0 10px;text-wrap:balance}
  .sub{color:var(--muted);margin:0 0 22px;max-width:56ch}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}
  .lab{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
  label{display:block;font-size:13px;font-weight:500;margin:0 0 6px}
  input,select{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;color:var(--fg)}
  .btn{appearance:none;border:none;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:600;font-size:14px;padding:12px 18px;cursor:pointer;width:100%;margin-top:12px}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg);font-weight:500;width:auto}
  .note{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-top:12px;line-height:1.6}
  .msg{border-radius:10px;padding:11px 13px;font-size:13px;margin-top:12px}
  .msg.ok{background:var(--accent-weak);color:var(--accent)}
  .msg.err{background:#fde8e6;color:#c0392b}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .msg.err{background:#2a1512;color:#ff8a80}}
  :root[data-theme="dark"] .msg.err{background:#2a1512;color:#ff8a80}
  .badge{display:inline-block;font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.07em;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .badge.exploring{color:var(--star);border-color:var(--star)}
  .badge.requested{color:var(--accent);border-color:var(--accent)}
  .badge.confirmed{color:#fff;background:var(--accent);border-color:var(--accent)}
  /* progress */
  .bar{height:7px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin:4px 0 16px}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  /* steps */
  .step{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;background:var(--surface-2)}
  .step .top{display:flex;align-items:flex-start;gap:11px}
  .step .n{font-family:var(--font-mono);font-size:11px;color:var(--accent);flex:none;margin-top:2px}
  .step h4{font-family:var(--font-display);font-weight:600;font-size:16px;margin:0 0 2px}
  .step p{font-size:13px;color:var(--muted);margin:0}
  .step .chk{margin-left:auto;flex:none;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none}
  .step .chk input{width:17px;height:17px;accent-color:var(--accent)}
  .step.done{border-color:var(--accent)}
  /* market picker */
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .chip{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer;background:var(--surface-2);color:var(--fg)}
  .chip.sel{border-color:var(--accent);color:var(--accent);background:var(--accent-weak)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:560px){.two{grid-template-columns:1fr}}
  .reqrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px}
  .reqrow b{font-family:var(--font-display);font-weight:600}
  a.site{display:inline-flex;align-items:center;gap:7px;color:var(--accent);text-decoration:none;font-weight:600;font-size:14px}
  .state{padding:40px 0;text-align:center;font-family:var(--font-mono);font-size:13px;color:var(--muted)}
  footer{border-top:1px solid var(--line);padding:22px 0;font-family:var(--font-mono);font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<header><div class="wrap hd">
  <a class="brand" href="../">
    <svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5l2.2 7.1 7.3.1-5.9 4.4 2.2 7-5.8-4.3L6.2 20l2.2-7L2.5 8.7l7.3-.1L12 1.5z" fill="var(--star)"/></svg>
    <b>Merope</b><span>· espace opérateur</span>
  </a>
  <nav class="nav">
    <a href="../secondary/">Marché secondaire</a>
    <a href="../#comment">Comment ça marche</a>
    <a href="./" aria-current="page">Mon espace</a>
  </nav>
  <div class="right" id="hdright">
    <button class="tgl" id="tgl" title="Thème">◐</button>
  </div>
</div></header>

<main class="wrap" id="app">
  <div class="state">Chargement de votre espace…</div>
</main>

<footer><div class="wrap">Merope · révéler les marchés cachés — prototype. © Dreamotion OÜ.</div></footer>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SB_URL='https://rjcuuejbpkmtcxgiqyfo.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqY3V1ZWpicGttdGN4Z2lxeWZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMTAzMzEsImV4cCI6MjEwNjY4NjMzMX0.HEeR9Ee23d2PWMsHjlOc914XGIYvk9s8t4pLXWTZ7_A';
const sb = createClient(SB_URL, SB_KEY, { auth:{ detectSessionInUrl:true, persistSession:true } });

const app = document.getElementById('app');
const hdright = document.getElementById('hdright');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* theme */
const tgl=document.getElementById('tgl');
try{const s=localStorage.getItem('merope-theme'); if(s)document.documentElement.setAttribute('data-theme',s);}catch(e){}
tgl.onclick=()=>{const cur=document.documentElement.getAttribute('data-theme');const sysDark=matchMedia('(prefers-color-scheme:dark)').matches;const n=cur?(cur==='dark'?'light':'dark'):(sysDark?'light':'dark');document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('merope-theme',n);}catch(e){}};

const STEPS=[
  {k:'market',  t:'Marché × territoire',     d:'Votre licence prioritaire — un marché, un territoire. C’est votre périmètre d’intelligence.'},
  {k:'protocol',t:'Protocole & sources',      d:'Le schéma imposé par Merope + les sources autorisées. Vos données parlent un langage commun.'},
  {k:'sensors', t:'Capteurs + Studio',        d:'API, documents, web. Vous validez les observations ; Merope les structure.'},
  {k:'products',t:'Premiers produits',        d:'Vos datasets, historiques et signaux listés dans la marketplace.'},
  {k:'revenue', t:'Revenus & priorité',       d:'70 % des ventes vous reviennent, plus la priorité d’opération sur votre marché.'},
];

/* ---------- LOGIN VIEW ---------- */
function renderLogin(){
  hdright.innerHTML='<button class="tgl" id="tgl2" title="Thème">◐</button>';
  document.getElementById('tgl2').onclick=tgl.onclick;
  app.innerHTML=`
    <div class="eyebrow">Programme Founding Operator</div>
    <h1>Votre espace opérateur Merope.</h1>
    <p class="sub">Connectez-vous avec votre email. Vous découvrirez votre futur marché, les étapes d’onboarding, et vous pourrez réserver votre territoire.</p>
    <div class="panel">
      <div class="lab">Connexion · lien magique</div>
      <label for="em">Votre email</label>
      <input id="em" type="email" placeholder="vous@exemple.com" autocomplete="email">
      <button class="btn" id="send">Recevoir mon lien de connexion</button>
      <div id="loginmsg"></div>
      <div class="note">Pas de mot de passe. On vous envoie un lien sécurisé ; cliquez dessus et vous êtes connecté. Le lien revient directement sur cette page.</div>
    </div>`;
  const em=document.getElementById('em'), btn=document.getElementById('send'), m=document.getElementById('loginmsg');
  async function send(){
    const email=(em.value||'').trim();
    if(!/.+@.+\..+/.test(email)){m.className='msg err';m.textContent='Entrez un email valide.';return;}
    btn.disabled=true;btn.textContent='Envoi…';m.textContent='';
    try{
      const redirect=location.origin+location.pathname;
      const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:redirect}});
      if(error)throw error;
      m.className='msg ok';m.textContent='Lien envoyé ✓ Vérifiez votre boîte mail (et les spams). Cliquez sur le lien pour accéder à votre espace.';
    }catch(e){m.className='msg err';m.textContent='Erreur : '+esc(e.message||e);}
    btn.disabled=false;btn.textContent='Recevoir mon lien de connexion';
  }
  btn.onclick=send; em.addEventListener('keydown',e=>{if(e.key==='Enter')send();});
}

/* ---------- DASHBOARD VIEW ---------- */
async function renderDashboard(session){
  const uid=session.user.id, email=session.user.email;
  hdright.innerHTML=`<span class="umail">${esc(email)}</span><button class="lnk" id="out">Déconnexion</button><button class="tgl" id="tgl2" title="Thème">◐</button>`;
  document.getElementById('out').onclick=async()=>{await sb.auth.signOut();};
  document.getElementById('tgl2').onclick=tgl.onclick;
  app.innerHTML='<div class="state">Préparation de votre espace…</div>';

  // ensure onboarding row
  try{ await sb.from('member_onboarding').upsert({user_id:uid,email},{onConflict:'user_id'}); }catch(e){}

  // load in parallel
  let me={}, reqs=[], markets=[], territories=[], slots=[];
  try{
    const [a,b,c,d]=await Promise.all([
      sb.from('member_onboarding').select('*').eq('user_id',uid).maybeSingle(),
      sb.from('market_requests').select('id,status,note,markets(name),territories(name)').eq('user_id',uid).order('created_at',{ascending:false}),
      sb.from('markets').select('id,slug,name,tagline').order('sort_order'),
      sb.from('territories').select('id,slug,name').order('name'),
    ]);
    me=a.data||{status:'exploring',steps:{}}; reqs=b.data||[]; markets=c.data||[]; territories=d.data||[];
    const s=await sb.from('operators').select('name,markets(name),territories(name)').eq('status','founding');
    slots=s.data||[];
  }catch(e){ app.innerHTML=`<div class="msg err">Impossible de charger votre espace : ${esc(e.message||e)}</div>`; return; }

  const steps=me.steps||{};
  const done=STEPS.filter(s=>steps[s.k]).length;
  const pct=Math.round(done/STEPS.length*100);
  const status=me.status||'exploring';
  const statusLabel={exploring:'En exploration',requested:'Marché demandé',confirmed:'Opérateur confirmé'}[status]||status;
  const hasReq=reqs.length>0;

  app.innerHTML=`
    <div class="eyebrow">Bienvenue${me.full_name?', '+esc(me.full_name):''}</div>
    <h1>Votre espace opérateur.</h1>
    <p class="sub">Voici votre futur marché et le chemin pour le mettre en production. <span class="badge ${status}">${esc(statusLabel)}</span></p>

    <div class="panel">
      <div class="lab">Votre marché × territoire</div>
      <div id="marketzone"></div>
    </div>

    <div class="panel">
      <div class="lab">Votre onboarding — ${done}/${STEPS.length} étapes</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div id="steps"></div>
    </div>

    <div class="panel">
      <div class="lab">Votre futur site</div>
      <p class="sub" style="margin-bottom:12px">Vos datasets apparaîtront dans la marketplace Merope, sous votre nom d’opérateur. Voici la vitrine en direct :</p>
      <a class="site" href="../" target="_blank" rel="noopener">Ouvrir la marketplace Merope →</a>
    </div>`;

  /* --- steps --- */
  const stepsEl=document.getElementById('steps');
  stepsEl.innerHTML=STEPS.map((s,i)=>`
    <div class="step ${steps[s.k]?'done':''}" data-k="${s.k}">
      <div class="top">
        <span class="n">0${i+1}</span>
        <div><h4>${esc(s.t)}</h4><p>${esc(s.d)}</p></div>
        <label class="chk"><input type="checkbox" ${steps[s.k]?'checked':''} data-step="${s.k}"> fait</label>
      </div>
    </div>`).join('');
  stepsEl.querySelectorAll('input[data-step]').forEach(cb=>cb.onchange=async()=>{
    steps[cb.dataset.step]=cb.checked;
    cb.closest('.step').classList.toggle('done',cb.checked);
    const nd=STEPS.filter(s=>steps[s.k]).length;
    document.querySelector('.bar i').style.width=Math.round(nd/STEPS.length*100)+'%';
    document.querySelectorAll('.lab')[1].textContent=`Votre onboarding — ${nd}/${STEPS.length} étapes`;
    try{ await sb.from('member_onboarding').update({steps,updated_at:new Date().toISOString()}).eq('user_id',uid); }catch(e){}
  });

  /* --- market zone --- */
  const mz=document.getElementById('marketzone');
  function renderMarket(){
    if(hasReq){
      mz.innerHTML=reqs.map(r=>{
        const sb_=({requested:'requested',confirmed:'confirmed',declined:'exploring'})[r.status]||'exploring';
        const sl=({requested:'En attente de confirmation',confirmed:'Confirmé ✓',declined:'Refusé'})[r.status]||r.status;
        return `<div class="reqrow"><b>${esc(r.markets?r.markets.name:'—')}</b> · ${esc(r.territories?r.territories.name:'—')} <span class="badge ${sb_}" style="margin-left:auto">${esc(sl)}</span></div>`;
      }).join('')+`<div class="note">Dreamotion revient vers vous pour confirmer votre territoire. Vous pouvez avancer vos étapes d’onboarding en attendant.</div>`;
      return;
    }
    const slotChips=slots.map(s=>`${s.markets?s.markets.name:''} / ${s.territories?s.territories.name:''}`).filter(x=>x.trim()!=='/').slice(0,6);
    mz.innerHTML=`
      <p class="sub" style="margin-bottom:12px">Choisissez le marché et le territoire que vous voulez opérer. Votre demande est envoyée à Dreamotion, qui confirme votre licence prioritaire.</p>
      ${slotChips.length?`<div class="lab" style="margin-top:4px">Licences fondatrices ouvertes</div><div class="chips" id="slots">${slotChips.map(c=>`<button class="chip" type="button" data-slot="${esc(c)}">${esc(c)}</button>`).join('')}</div>`:''}
      <div class="two">
        <div><label for="mk">Marché</label><select id="mk"><option value="">—</option>${markets.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></div>
        <div><label for="tr">Territoire</label><select id="tr"><option value="">—</option>${territories.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div>
      </div>
      <button class="btn" id="reqbtn">Demander ce marché</button>
      <div id="reqmsg"></div>`;
    const mk=document.getElementById('mk'), tr=document.getElementById('tr'), rb=document.getElementById('reqbtn'), rm=document.getElementById('reqmsg');
    mz.querySelectorAll('[data-slot]').forEach(c=>c.onclick=()=>{
      const [mName,tName]=c.dataset.slot.split(' / ');
      const mo=markets.find(m=>m.name===mName.trim()); const to=territories.find(t=>t.name===tName.trim());
      if(mo)mk.value=mo.id; if(to)tr.value=to.id;
      mz.querySelectorAll('.chip').forEach(x=>x.classList.remove('sel')); c.classList.add('sel');
    });
    rb.onclick=async()=>{
      if(!mk.value||!tr.value){rm.className='msg err';rm.textContent='Choisissez un marché et un territoire.';return;}
      rb.disabled=true;rb.textContent='Envoi…';rm.textContent='';
      try{
        const {error}=await sb.from('market_requests').insert({user_id:uid,market_id:mk.value,territory_id:tr.value});
        if(error)throw error;
        await sb.from('member_onboarding').update({status:'requested',updated_at:new Date().toISOString()}).eq('user_id',uid);
        steps.market=true; try{await sb.from('member_onboarding').update({steps}).eq('user_id',uid);}catch(e){}
        rm.className='msg ok';rm.textContent='Demande envoyée ✓ Dreamotion revient vers vous pour confirmer.';
        setTimeout(()=>location.reload(),1400);
      }catch(e){rm.className='msg err';rm.textContent='Erreur : '+esc(e.message||e);rb.disabled=false;rb.textContent='Demander ce marché';}
    };
  }
  renderMarket();
}

/* ---------- ROUTER ---------- */
async function route(){
  const {data:{session}}=await sb.auth.getSession();
  if(session) renderDashboard(session); else renderLogin();
}
sb.auth.onAuthStateChange((_e,session)=>{ if(session) renderDashboard(session); else renderLogin(); });
route();
</script>
</body>
</html>
